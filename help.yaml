상태:
  S0: 연결을 시작했지만 응답을 받지 못했습니다.
  SF: 연결이 정상적으로 끝났습니다.
  REJ: 연결 요청이 거부되었습니다.
  RSTO: 시작한 쪽이 연결을 강제로 끊었습니다.
  RSTR: 응답한 쪽이 연결을 강제로 끊었습니다.
  OTH: 연결 시작을 확인하지 못했습니다.
열:
  번호: 파일에서 읽은 순서입니다.
  표시: 선택된 대화나 시간대에 해당하는 강조 표시입니다.
  시간: 레코드가 기록된 시각입니다.
  출발지: 연결을 시작한 주소입니다.
  목적지: 데이터를 받는 주소입니다.
  포트: 프로그램을 구분하는 번호입니다.
  사용자: 로그에 기록된 계정 이름입니다.
  종류: 로그 이벤트 또는 네트워크 프로토콜입니다.
  상태: 연결의 시작과 종료 상태입니다.
  요약: 레코드의 주요 내용을 간단히 보여 줍니다.
  대화: 같은 연결에 속한 패킷의 식별자입니다.
  출발지:포트: 연결을 시작한 주소와 포트입니다.
  목적지:포트: 데이터를 받는 주소와 포트입니다.
  지속 시간: 대화가 이어진 시간입니다.
  패킷 수: 대화에 포함된 패킷 개수입니다.
  바이트 합계: 대화에 포함된 패킷 크기의 합입니다.
  흐름: 양쪽이 주고받은 패킷 종류의 순서입니다.
