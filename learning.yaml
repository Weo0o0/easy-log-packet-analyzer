scenarios:
  - id: ssh_repeated_fail
    title: SSH 로그인 실패 반복
    sample: OpenSSH_2k.log
    example_only: false
    stages:
      - {kind: cause, title: 원인, text: 같은 출발지에서 비밀번호 로그인이 여러 번 실패합니다.}
      - {kind: evidence, title: 생기는 로그, text: 같은 출발지 IP의 Failed password 줄이 이어집니다. 이 샘플에서 183.62.140.253은 286줄입니다., lines: ["Failed password for … from 183.62.140.253"]}
      - {kind: result, title: 결과, text: 7단계 경고 카드가 뜰 수 있습니다. 같은 IP의 성공 기록이 있는지 확인합니다.}
  - id: dns_query_answer
    title: DNS 질문과 대답
    sample: dns.cap
    example_only: false
    stages:
      - {kind: cause, title: 원인, text: 컴퓨터가 웹 주소의 IP를 몰라 DNS 서버에 묻습니다.}
      - {kind: evidence, title: 생기는 패킷, text: UDP 53번 포트로 질문과 대답이 오갑니다., lines: ["Ethernet / IP / UDP / DNS"]}
      - {kind: result, title: 결과, text: 대화 상태는 SF(양쪽 모두 보임)이고 컴퓨터는 받은 IP로 접속합니다.}
  - id: web_404
    title: 없는 웹 주소 요청 (404)
    sample: apache_logs
    example_only: false
    stages:
      - {kind: cause, title: 원인, text: 웹 브라우저가 서버에 없는 주소를 요청합니다.}
      - {kind: evidence, title: 생기는 로그, text: 웹 접속 로그에 404 상태가 남습니다. 이 샘플에는 213줄이 있습니다., lines: ["GET /없는-주소 HTTP/1.1 404"]}
      - {kind: result, title: 결과, text: 요청한 경로와 뒤이어 성공한 응답이 있는지 확인합니다.}
  - id: udp_one_side
    title: 한쪽 방향만 보이는 UDP
    sample: 교육용 예시
    example_only: true
    stages:
      - {kind: cause, title: 원인, text: 질문은 보냈지만 대답이 캡처 위치를 지나가지 않았습니다.}
      - {kind: evidence, title: 생기는 패킷, text: 192.0.2.10에서 198.51.100.53으로 UDP 53 질문만 보입니다., lines: ["교육용 예시: 192.0.2.10:40000 → 198.51.100.53:53"]}
      - {kind: result, title: 결과, text: 대화 상태는 S0입니다. 바로 문제라고 단정하지 말고 캡처 위치를 확인합니다.}
